<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">A test can still make a real change.</title><desc id="desc">Original explanatory diagram of defensive controls. Not an attack guide or measured success rate.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#42737e" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" rx="28" fill="#f3f7f5"/><g font-family="Arial,sans-serif"><text x="60" y="75" fill="#3e6d77" font-size="18" letter-spacing="3">EXPLAINING THE NEWS</text><text x="60" y="133" fill="#193d47" font-size="40" font-weight="700">A test can still make a real change.</text><text x="60" y="174" fill="#567078" font-size="21">Anthropic evaluation disclosure, October 9, 2026</text><rect x="60" y="235" width="340" height="230" rx="18" fill="white" stroke="#a5c2c8" stroke-width="2"/><circle cx="99" cy="277" r="19" fill="#deedf0"/><text x="93" y="284" fill="#3e6d77" font-size="20" font-weight="700">1</text><text x="85" y="329" fill="#193d47" font-size="26" font-weight="700">Define the boundary</text><text x="85" y="371" fill="#567078" font-size="19">Separate test and live systems</text><text x="85" y="401" fill="#567078" font-size="19">Specify allowed destinations</text><text x="85" y="431" fill="#567078" font-size="19">Limit final submissions</text><path d="M406 345h17" fill="none" stroke="#42737e" stroke-width="2" marker-end="url(#arr)"/><rect x="430" y="235" width="340" height="230" rx="18" fill="white" stroke="#a5c2c8" stroke-width="2"/><circle cx="469" cy="277" r="19" fill="#deedf0"/><text x="463" y="284" fill="#3e6d77" font-size="20" font-weight="700">2</text><text x="455" y="329" fill="#193d47" font-size="26" font-weight="700">Enforce it</text><text x="455" y="371" fill="#567078" font-size="19">Contain network access</text><text x="455" y="401" fill="#567078" font-size="19">Monitor unexpected actions</text><text x="455" y="431" fill="#567078" font-size="19">Stop and ask a person</text><path d="M776 345h17" fill="none" stroke="#42737e" stroke-width="2" marker-end="url(#arr)"/><rect x="800" y="235" width="340" height="230" rx="18" fill="white" stroke="#a5c2c8" stroke-width="2"/><circle cx="839" cy="277" r="19" fill="#deedf0"/><text x="833" y="284" fill="#3e6d77" font-size="20" font-weight="700">3</text><text x="825" y="329" fill="#193d47" font-size="26" font-weight="700">Review and repair</text><text x="825" y="371" fill="#567078" font-size="19">Investigate actual effects</text><text x="825" y="401" fill="#567078" font-size="19">Fix test and training conditions</text><text x="825" y="431" fill="#567078" font-size="19">Verify before restoring access</text><rect x="60" y="500" width="1080" height="80" rx="16" fill="#deedf0"/><text x="85" y="547" fill="#193d47" font-size="23" font-weight="700">Success on known cases does not prove safety in every new setting.</text><text x="60" y="627" fill="#567078" font-size="17">Original explanatory diagram of defensive controls. Not an attack guide or measured success rate.</text></g></svg>