<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Images 2.6: more output choices</title><desc id="desc">Available in ChatGPT, Codex and the API, according to the November 4 announcement. Speed claims are vendor-reported. Diagrams, text and animation still require review.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12263b"/><stop offset="1" stop-color="#242044"/></linearGradient><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2L9 6L2 10" fill="none" stroke="#87b4c8" stroke-width="2"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="Arial, Helvetica, sans-serif"><text x="65" y="65" fill="#8ce1d2" font-size="18" letter-spacing="4">TECHNOLOGY / NOVEMBER 2026</text><text x="65" y="123" fill="#f3f6fc" font-size="42" font-weight="700">Images 2.6: more output choices</text><text x="65" y="164" fill="#b6c8dc" font-size="21">Planning effort and rendering detail are separate controls.</text><rect x="65" y="210" width="310" height="230" rx="22" fill="#1c354d" stroke="#53738e"/><text x="90" y="254" fill="#8ce1d2" font-size="16" letter-spacing="2">PLAN</text><text x="90" y="301" fill="#fff" font-size="27" font-weight="700">Complexity</text><text x="90" y="345" fill="#c8d8e6" font-size="19">Composition and layout</text><text x="90" y="378" fill="#c8d8e6" font-size="19">Low / medium / high</text><text x="90" y="411" fill="#c8d8e6" font-size="19">More is not always better</text><path d="M387 325H430" fill="none" stroke="#87b4c8" stroke-width="3" marker-end="url(#arr)"/><rect x="445" y="210" width="310" height="230" rx="22" fill="#1c354d" stroke="#53738e"/><text x="470" y="254" fill="#8ce1d2" font-size="16" letter-spacing="2">RENDER</text><text x="470" y="301" fill="#fff" font-size="27" font-weight="700">Image quality</text><text x="470" y="345" fill="#c8d8e6" font-size="19">Detail and visual fidelity</text><text x="470" y="378" fill="#c8d8e6" font-size="19">Markup guides an edit</text><text x="470" y="411" fill="#c8d8e6" font-size="19">Review unintended changes</text><path d="M767 325H810" fill="none" stroke="#87b4c8" stroke-width="3" marker-end="url(#arr)"/><rect x="825" y="210" width="310" height="230" rx="22" fill="#1c354d" stroke="#53738e"/><text x="850" y="254" fill="#8ce1d2" font-size="16" letter-spacing="2">OUTPUT</text><text x="850" y="301" fill="#fff" font-size="27" font-weight="700">Still / SVG / GIF</text><text x="850" y="345" fill="#c8d8e6" font-size="19">SVG: static vector content</text><text x="850" y="378" fill="#c8d8e6" font-size="19">GIF: short frame sequence</text><text x="850" y="411" fill="#c8d8e6" font-size="19">SVG + GIF: generation only</text><rect x="65" y="478" width="1070" height="95" rx="18" fill="#fff" opacity=".05"/><text x="88" y="518" fill="#ecf1f6" font-size="20">Available in ChatGPT, Codex and the API, according to the November 4 announcement.</text><text x="88" y="549" fill="#a9bdd2" font-size="18">Speed claims are vendor-reported. Diagrams, text and animation still require review.</text><text x="65" y="625" fill="#93a9c0" font-size="16">TECH DAILY · Original explanatory diagram · Not a product screenshot or measured result</text></g></svg>