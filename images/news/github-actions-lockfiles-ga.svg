<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">GitHub Actions dependency locking</title><desc id="desc">Original explanatory diagram: review dependencies, lock action commits, verify execution. Reusable workflow calls and container images require separate management.</desc>
<rect width="1200" height="675" fill="#101d2a"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="70" y="90" fill="#86d4cf" font-size="21" letter-spacing="3">SOFTWARE SUPPLY CHAIN</text><text x="70" y="160" fill="#f5f9fc" font-size="48" font-weight="700">GitHub Actions lockfiles</text><text x="70" y="204" fill="#afc4d2" font-size="25">General availability · October 28, 2026</text>
<g fill="#1c3443" stroke="#437484" stroke-width="2"><rect x="70" y="285" width="310" height="185" rx="18"/><rect x="445" y="285" width="310" height="185" rx="18"/><rect x="820" y="285" width="310" height="185" rx="18"/></g>
<g stroke="#86d4cf" stroke-width="4" fill="none"><path d="M394 378h36m-11-10 11 10-11 10"/><path d="M769 378h36m-11-10 11 10-11 10"/></g>
<g fill="#86d4cf" font-size="20"><text x="95" y="323">01</text><text x="470" y="323">02</text><text x="845" y="323">03</text></g>
<g fill="#f5f9fc" font-size="29" font-weight="700"><text x="95" y="372">Review sources</text><text x="470" y="372">Lock versions</text><text x="845" y="372">Verify execution</text></g>
<g fill="#afc4d2" font-size="21"><text x="95" y="417">Choose trusted versions</text><text x="470" y="417">Direct + transitive actions</text><text x="845" y="417">Use recorded versions</text></g>
<rect x="70" y="511" width="1060" height="64" rx="12" fill="#2b3441"/><text x="95" y="550" fill="#e8d8ac" font-size="23">Separate coverage: reusable workflow calls · container images · other inputs</text><text x="70" y="625" fill="#91a9b9" font-size="19">Original explanatory diagram · Locking versions does not establish that dependencies are safe.</text>
</g></svg>
