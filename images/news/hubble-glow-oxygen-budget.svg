<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">GLOW: an oxygen budget for 37 nearby dwarf galaxies</title>
<desc id="desc">Original explanatory diagram comparing estimated cumulative stellar oxygen production with oxygen retained in disks. About eleven percent is the sample mean, not a measurement of oxygen mass fraction. The destination of missing oxygen remains uncertain.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10203b"/><stop offset="1" stop-color="#1b1740"/></linearGradient><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2L9 6L2 10" fill="none" stroke="#8ca8c9" stroke-width="2"/></marker></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="65" y="66" font-size="18" letter-spacing="4" fill="#80dcd7">SPACE SCIENCE / GLOW</text><text x="65" y="122" font-size="42" font-weight="700" fill="#f0f6ff">Where did the oxygen go?</text><text x="65" y="158" font-size="20" fill="#b2c2d9">37 nearby, gas-rich dwarf galaxies · archival observations</text>
<rect x="65" y="205" width="310" height="230" rx="23" fill="#1d3552" stroke="#44617f"/>
<text x="92" y="249" font-size="16" letter-spacing="2" fill="#9db5cf">ESTIMATED PRODUCTION</text><text x="92" y="298" font-size="29" font-weight="700" fill="#fff">Stars make oxygen</text><text x="92" y="340" font-size="20" fill="#c8d6e8">Stellar mass and yields</text><text x="92" y="373" font-size="20" fill="#c8d6e8">estimate the total made</text><text x="92" y="406" font-size="20" fill="#c8d6e8">over a galaxy’s history.</text>
<path d="M387 320H428" stroke="#8ca8c9" stroke-width="3" marker-end="url(#arr)"/>
<rect x="445" y="205" width="310" height="230" rx="23" fill="#173b43" stroke="#3a8d93"/>
<text x="472" y="249" font-size="16" letter-spacing="2" fill="#99ded7">RETAINED IN DISKS</text><text x="472" y="315" font-size="58" font-weight="700" fill="#adf0dc">~11%</text><text x="472" y="357" font-size="20" fill="#d0e9e4">Sample mean retained</text><text x="472" y="390" font-size="20" fill="#d0e9e4">in gas, stars and dust</text><text x="472" y="417" font-size="15" fill="#9cbebd">Range across targets: about 4–25%</text>
<path d="M767 320H808" stroke="#8ca8c9" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<rect x="825" y="205" width="310" height="230" rx="23" fill="#302d4b" stroke="#6f628f"/>
<text x="852" y="249" font-size="16" letter-spacing="2" fill="#c6b4e0">OPEN QUESTION</text><text x="852" y="298" font-size="29" font-weight="700" fill="#fff">Beyond the disk?</text><text x="852" y="340" font-size="20" fill="#d8cce8">Surrounding gas</text><text x="852" y="373" font-size="20" fill="#d8cce8">or intergalactic space?</text><text x="852" y="406" font-size="20" fill="#d8cce8">Not yet established.</text>
<rect x="65" y="478" width="1070" height="95" rx="18" fill="#ffffff" opacity=".045"/><text x="89" y="518" font-size="21" fill="#e1e7f1">The fraction compares retained oxygen with cumulative stellar production.</text><text x="89" y="548" font-size="19" fill="#afbdd3">It is not the oxygen share of total galaxy mass, or a map of escaped material.</text>
<text x="65" y="625" font-size="16" fill="#8ca0bb">TECH DAILY · Original explanatory diagram based on GLOW II / NASA · Not a telescope image</text></g></svg>
