<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#101e2c"/><style>text{font-family:Arial,sans-serif;fill:#eef5fb}.title{font-size:38px;font-weight:700}.sub{font-size:19px;fill:#a9c3d7}.label{font-size:23px;font-weight:700}.small{font-size:18px;fill:#b6cbdc}.value{font-size:46px;font-weight:700;fill:#65ddcb}</style><title>TSMC September revenue comparison bases</title><text x="64" y="85" class="title">TSMC: one revenue figure, different comparisons</text><text x="64" y="126" class="sub">September 2026 | NT$511.86 billion | disclosed October 8, 2026</text><rect x="64" y="190" width="330" height="280" rx="24" fill="#1d3548"/><text x="89" y="260" class="label">Year on year</text><text x="89" y="340" class="value">+54.6%</text><text x="89" y="410" class="small">September 2025 → 2026</text><rect x="435" y="190" width="330" height="280" rx="24" fill="#1d3548"/><text x="460" y="260" class="label">Month on month</text><text x="460" y="340" class="value">−0.6%</text><text x="460" y="410" class="small">August → September 2026</text><rect x="806" y="190" width="330" height="280" rx="24" fill="#1d3548"/><text x="831" y="260" class="label">Nine-month total</text><text x="831" y="340" class="value">+41.1%</text><text x="831" y="410" class="small">Jan–Sep 2025 → 2026</text><text x="64" y="540" class="label">Different time windows use different comparison bases.</text><text x="64" y="580" class="small">Revenue does not establish profit, customer mix or future growth.</text><text x="64" y="635" class="sub">Original explanatory graphic • Source: TSMC September revenue disclosure</text></svg>