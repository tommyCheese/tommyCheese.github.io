<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Planned grid demand response</title><desc id="desc">Original explanatory diagram. Future campuses would lower demand when the grid is strained under site-specific agreements. Georgia pilot is still in development.</desc><rect width="1200" height="675" fill="#101d2a"/><g font-family="Arial,Helvetica,sans-serif"><text x="65" y="85" fill="#86d4cf" font-size="21" letter-spacing="3">AI INFRASTRUCTURE · ELECTRICITY DEMAND</text><text x="65" y="155" fill="#f5f9fc" font-size="43" font-weight="700">Compute demand that can respond</text><text x="65" y="200" fill="#afc4d2" font-size="25">Grid Protectors: a plan for future U.S. campuses</text><rect x="65" y="278" width="335" height="190" rx="18" fill="#1c3443" stroke="#437484" stroke-width="2"/><text x="89" y="319" fill="#86d4cf" font-size="20">01</text><text x="89" y="373" fill="#f5f9fc" font-size="28" font-weight="700">Grid stress</text><text x="89" y="420" fill="#afc4d2" font-size="22">Utility requests a reduction</text><path d="M407 374h16m-7-8 8 8-8 8" stroke="#86d4cf" stroke-width="3" fill="none"/><rect x="430" y="278" width="335" height="190" rx="18" fill="#1c3443" stroke="#437484" stroke-width="2"/><text x="454" y="319" fill="#86d4cf" font-size="20">02</text><text x="454" y="373" fill="#f5f9fc" font-size="28" font-weight="700">Campus response</text><text x="454" y="420" fill="#afc4d2" font-size="22">Lower agreed power draw</text><path d="M772 374h16m-7-8 8 8-8 8" stroke="#86d4cf" stroke-width="3" fill="none"/><rect x="795" y="278" width="335" height="190" rx="18" fill="#1c3443" stroke="#437484" stroke-width="2"/><text x="819" y="319" fill="#86d4cf" font-size="20">03</text><text x="819" y="373" fill="#f5f9fc" font-size="28" font-weight="700">Verify outcomes</text><text x="819" y="420" fill="#afc4d2" font-size="22">Response + cost allocation</text><rect x="65" y="511" width="1070" height="67" rx="12" fill="#2b3441"/><text x="88" y="552" fill="#e8d8ac" font-size="23">Georgia pilot: up to 1,000 MW · A contractual limit, not measured savings</text><text x="65" y="624" fill="#91a9b9" font-size="20">Original explanatory diagram · Planned response, not an operating record.</text></g></svg>
