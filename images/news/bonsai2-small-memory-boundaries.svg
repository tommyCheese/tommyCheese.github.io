<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
<title>Small weights, separate budgets</title>
<desc>Ternary Bonsai 2: distinguish storage from the whole application. Compact language weights do not mean the full app fits in that size.</desc>
<rect width="1200" height="675" fill="#101d2a"/>
<g font-family="Arial, sans-serif">
<text x="70" y="85" fill="#86d4cf" font-size="21" letter-spacing="3">LOCAL MODEL DEPLOYMENT</text>
<text x="70" y="160" fill="#f0f7fa" font-size="46" font-weight="700">Small weights, separate budgets</text>
<text x="70" y="210" fill="#b7c7d1" font-size="24">Ternary Bonsai 2: distinguish storage from the whole application.</text>
<rect x="70" y="280" width="310" height="180" rx="18" fill="#1b3445" stroke="#3a6578"/>
<text x="94" y="334" fill="#86d4cf" font-size="20">01</text>
<text x="94" y="377" fill="#f0f7fa" font-size="27" font-weight="700">Language weights</text>
<text x="94" y="419" fill="#c4d3db" font-size="19">2B: 0.43 GB / 9B: 2 GB</text>
<path d="M 396 370 h 30 m -9 -8 l 9 8 -9 8" fill="none" stroke="#86d4cf" stroke-width="3"/>
<rect x="445" y="280" width="310" height="180" rx="18" fill="#1b3445" stroke="#3a6578"/>
<text x="469" y="334" fill="#86d4cf" font-size="20">02</text>
<text x="469" y="377" fill="#f0f7fa" font-size="27" font-weight="700">Extra memory</text>
<text x="469" y="419" fill="#c4d3db" font-size="19">Vision + runtime + context</text>
<path d="M 771 370 h 30 m -9 -8 l 9 8 -9 8" fill="none" stroke="#86d4cf" stroke-width="3"/>
<rect x="820" y="280" width="310" height="180" rx="18" fill="#1b3445" stroke="#3a6578"/>
<text x="844" y="334" fill="#86d4cf" font-size="20">03</text>
<text x="844" y="377" fill="#f0f7fa" font-size="27" font-weight="700">Task quality</text>
<text x="844" y="419" fill="#c4d3db" font-size="19">Measure each workload</text>
<rect x="70" y="510" width="1060" height="64" rx="12" fill="#254337"/>
<text x="94" y="550" fill="#d8eee1" font-size="22">Compact language weights do not mean the full app fits in that size.</text>
<text x="70" y="625" fill="#91a9b8" font-size="18">Original explanatory diagram based on published sources.</text>
</g></svg>
