<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Chat, Work and a shared allowance</title><desc id="desc">Original explanatory diagram. A limited combined Chat and Work test is planned; allowance sharing for Plus, Pro and Business begins in December. Instant chat is excluded.</desc><rect width="1200" height="675" fill="#101d2a"/><g font-family="Arial,Helvetica,sans-serif"><text x="65" y="85" fill="#86d4cf" font-size="21" letter-spacing="3">CHATGPT · PRODUCT AND USAGE CHANGES</text><text x="65" y="155" fill="#f5f9fc" font-size="43" font-weight="700">From conversation to continuing work</text><text x="65" y="200" fill="#afc4d2" font-size="25">A planned transition, with different rollout stages</text><rect x="65" y="278" width="335" height="190" rx="18" fill="#1c3443" stroke="#437484" stroke-width="2"/><text x="89" y="319" fill="#86d4cf" font-size="20">01</text><text x="89" y="373" fill="#f5f9fc" font-size="28" font-weight="700">Current roles</text><text x="89" y="420" fill="#afc4d2" font-size="22">Chat / Work / Codex</text><path d="M407 374h16m-7-8 8 8-8 8" stroke="#86d4cf" stroke-width="3" fill="none"/><rect x="430" y="278" width="335" height="190" rx="18" fill="#1c3443" stroke="#437484" stroke-width="2"/><text x="454" y="319" fill="#86d4cf" font-size="20">02</text><text x="454" y="373" fill="#f5f9fc" font-size="28" font-weight="700">Limited test</text><text x="454" y="420" fill="#afc4d2" font-size="22">Chat + Work experience</text><path d="M772 374h16m-7-8 8 8-8 8" stroke="#86d4cf" stroke-width="3" fill="none"/><rect x="795" y="278" width="335" height="190" rx="18" fill="#1c3443" stroke="#437484" stroke-width="2"/><text x="819" y="319" fill="#86d4cf" font-size="20">03</text><text x="819" y="373" fill="#f5f9fc" font-size="28" font-weight="700">From December</text><text x="819" y="420" fill="#afc4d2" font-size="22">Shared ChatGPT / Codex</text><rect x="65" y="511" width="1070" height="67" rx="12" fill="#2b3441"/><text x="88" y="552" fill="#e8d8ac" font-size="23">Plus, Pro, Business: shared allowance · Instant chat does not consume it</text><text x="65" y="624" fill="#91a9b9" font-size="20">Original explanatory diagram · Planned stages, not a product screenshot.</text></g></svg>
