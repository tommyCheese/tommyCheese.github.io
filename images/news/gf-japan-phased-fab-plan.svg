<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Funding is not finished capacity.</title><desc id="desc">Original explanatory diagram. Forecasts, not operating results; not a rendering of the site.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#42737e" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" rx="28" fill="#f3f7f5"/><g font-family="Arial,sans-serif"><text x="60" y="75" fill="#3e6d77" font-size="18" letter-spacing="3">EXPLAINING THE NEWS</text><text x="60" y="133" fill="#193d47" font-size="40" font-weight="700">Funding is not finished capacity.</text><text x="60" y="174" fill="#567078" font-size="21">GlobalFoundries / U.S.–Japan initiative announced October 14, 2026</text><rect x="60" y="235" width="340" height="230" rx="18" fill="white" stroke="#a5c2c8" stroke-width="2"/><circle cx="99" cy="277" r="19" fill="#deedf0"/><text x="93" y="284" fill="#3e6d77" font-size="20" font-weight="700">1</text><text x="85" y="329" fill="#193d47" font-size="26" font-weight="700">Capital + expertise</text><text x="85" y="371" fill="#567078" font-size="19">Japan: project investment</text><text x="85" y="401" fill="#567078" font-size="19">GF: technology and operations</text><text x="85" y="431" fill="#567078" font-size="19">Overall ceiling: $21 billion</text><path d="M406 345h17" fill="none" stroke="#42737e" stroke-width="2" marker-end="url(#arr)"/><rect x="430" y="235" width="340" height="230" rx="18" fill="white" stroke="#a5c2c8" stroke-width="2"/><circle cx="469" cy="277" r="19" fill="#deedf0"/><text x="463" y="284" fill="#3e6d77" font-size="20" font-weight="700">2</text><text x="455" y="329" fill="#193d47" font-size="26" font-weight="700">First fab</text><text x="455" y="371" fill="#567078" font-size="19">2029 production target</text><text x="455" y="401" fill="#567078" font-size="19">900,000 wafers / year</text><text x="455" y="431" fill="#567078" font-size="19">300mm; at full operation</text><path d="M776 345h17" fill="none" stroke="#42737e" stroke-width="2" marker-end="url(#arr)"/><rect x="800" y="235" width="340" height="230" rx="18" fill="white" stroke="#a5c2c8" stroke-width="2"/><circle cx="839" cy="277" r="19" fill="#deedf0"/><text x="833" y="284" fill="#3e6d77" font-size="20" font-weight="700">3</text><text x="825" y="329" fill="#193d47" font-size="26" font-weight="700">Second fab</text><text x="825" y="371" fill="#567078" font-size="19">Decision by end of 2028</text><text x="825" y="401" fill="#567078" font-size="19">Similar capacity if pursued</text><text x="825" y="431" fill="#567078" font-size="19">Not committed supply yet</text><rect x="60" y="500" width="1080" height="80" rx="16" fill="#deedf0"/><text x="85" y="547" fill="#193d47" font-size="23" font-weight="700">Plans depend on funding, construction and demand.</text><text x="60" y="627" fill="#567078" font-size="17">Original explanatory diagram. Forecasts, not operating results; not a rendering of the site.</text></g></svg>