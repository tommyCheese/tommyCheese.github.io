<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
<title>A conversation has several tests</title>
<desc>Grok Voice 3.0: speech, tool use and final task state. Benchmark scores and response latency describe different capabilities.</desc>
<rect width="1200" height="675" fill="#101d2a"/>
<g font-family="Arial, sans-serif">
<text x="70" y="85" fill="#86d4cf" font-size="21" letter-spacing="3">REAL-TIME VOICE</text>
<text x="70" y="160" fill="#f0f7fa" font-size="46" font-weight="700">A conversation has several tests</text>
<text x="70" y="210" fill="#b7c7d1" font-size="24">Grok Voice 3.0: speech, tool use and final task state.</text>
<rect x="70" y="280" width="310" height="180" rx="18" fill="#1b3445" stroke="#3a6578"/>
<text x="94" y="334" fill="#86d4cf" font-size="20">01</text>
<text x="94" y="377" fill="#f0f7fa" font-size="27" font-weight="700">Listen and respond</text>
<text x="94" y="419" fill="#c4d3db" font-size="19">Manage turns and pauses</text>
<path d="M 396 370 h 30 m -9 -8 l 9 8 -9 8" fill="none" stroke="#86d4cf" stroke-width="3"/>
