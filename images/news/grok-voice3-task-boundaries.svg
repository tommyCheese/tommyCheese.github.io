<text x="469" y="334" fill="#86d4cf" font-size="20">02</text>
<text x="469" y="377" fill="#f0f7fa" font-size="27" font-weight="700">Call business tools</text>
<text x="469" y="419" fill="#c4d3db" font-size="19">Application executes tasks</text>
<path d="M 771 370 h 30 m -9 -8 l 9 8 -9 8" fill="none" stroke="#86d4cf" stroke-width="3"/>
