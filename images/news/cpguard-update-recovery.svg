<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">cPGuard: recovery has two tracks</title><desc id="desc">Original explanatory diagram. About 2,950 servers and 7,900 accounts are different counts.</desc><rect width="1200" height="675" fill="#102a3b"/><g font-family="sans-serif"><text x="60" y="80" fill="#b4e8df" font-size="22">SOFTWARE SUPPLY CHAIN · NOVEMBER 2026</text><text x="60" y="155" fill="white" font-size="42" font-weight="700">cPGuard: recovery has two tracks</text><rect x="60" y="225" width="320" height="200" rx="18" fill="#214559"/><text x="84" y="275" fill="#f7cd8e" font-size="25" font-weight="700">PUBLISHER</text><text x="84" y="330" fill="#e2edf3" font-size="23">Billing and licensing</text><text x="84" y="375" fill="#e2edf3" font-size="22">Update access stolen</text><rect x="440" y="225" width="320" height="200" rx="18" fill="#214559"/><text x="464" y="275" fill="#f7cd8e" font-size="25" font-weight="700">CUSTOMER</text><text x="464" y="330" fill="#e2edf3" font-size="23">Malicious update</text><text x="464" y="375" fill="#e2edf3" font-size="22">Credentials exposed</text><rect x="820" y="225" width="320" height="200" rx="18" fill="#214559"/><text x="844" y="275" fill="#f7cd8e" font-size="25" font-weight="700">RECOVERY</text><text x="844" y="330" fill="#e2edf3" font-size="23">Remove known tools</text><text x="844" y="375" fill="#e2edf3" font-size="22">Invalidate stolen access</text><g stroke="#99d3cf" stroke-width="5" fill="none"><path d="M390 330h35m-12-10 12 10-12 10"/><path d="M770 330h35m-12-10 12 10-12 10"/></g><rect x="60" y="475" width="1080" height="100" rx="16" fill="#f2d99e"/><text x="82" y="515" fill="#243c49" font-size="24" font-weight="700">About 2,950 servers and 7,900 accounts are different counts.</text><text x="82" y="552" fill="#243c49" font-size="20">Vendor investigation estimates · Not a forensic measurement</text><text x="60" y="630" fill="#b4c6d2" font-size="19">Original explanatory redraw · Not a product screenshot or attack procedure</text></g></svg>
